# Lista de instalacion del servidor, agrupada por tematica.
# side: "both" = servidor y clientes; "server" = solo servidor.
# Los mods opcionales de cliente se autorizan en Catos, no se instalan aqui.

# === ANTICHEAT ===

[[mods]]
package = "catosaurluna-CatosAntiCheat"
version = "1.0.4"
category = "Anticheat"
side = "both"
description = "Controla mods adicionales, ausentes y versiones."
config = "Enforce, versiones Exact, espera 30 s, registro de accesos y aviso por chat. Opcionales: HudLayout 1.0.4 y FarmGrid_TT 1.1.2; solo servidor exentos; sin extras admin."

