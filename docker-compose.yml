services:
  valheim:
    image: ghcr.io/lloesche/valheim-server:latest
    container_name: valheim

    restart: unless-stopped
    stop_grace_period: 2m

    cap_add:
      - sys_nice

    ports:
      - "2456-2457:2456-2457/udp"

    volumes:
      - ./config:/config
      - ./data:/opt/valheim

    environment:
      SERVER_NAME: "Valheim Local"
      WORLD_NAME: "TestWorld"
      SERVER_PASS: "abc123.."
      SERVER_PUBLIC: "false"

      TZ: "Europe/Madrid"

      # BepInEx
      BEPINEX: "true"

      # Configuración del mundo
      SERVER_ARGS: >-
        -modifier combat veryhard
        -modifier deathpenalty hardcore
        -modifier raids muchless
        -setkey playerevents
        -setkey nomap
        -setkey NoPortals
        -setkey Fire

      # Backups
      BACKUPS: "true"
      BACKUPS_CRON: "0 * * * *"
      BACKUPS_MAX_AGE: "7"

      # Actualizaciones cada 6 horas
      UPDATE_CRON: "0 */6 * * *"