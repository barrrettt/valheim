services:
  mod-installer:
      profiles:
        - mods
      image: python:3.13-alpine
      container_name: valheim-mod-installer

      volumes:
        - ./mods:/mods:ro
        - ./config:/config

      working_dir: /mods

      command: /bin/sh -ec "python3 update_mods.py && sh sync_anticheat.sh"

      restart: "no"

  valheim:
    image: ghcr.io/lloesche/valheim-server:latest
    container_name: valheim

    restart: unless-stopped
    stop_grace_period: 2m

    cap_add:
      - sys_nice

    ports:
      - "2456-2457:2456-2457/udp"

    volumes:
      - ./config:/config
      - ./data:/opt/valheim

    environment:
      SERVER_NAME: "Valhell - hardcore"
      WORLD_NAME: "Valhell"
      SERVER_PASS: "huesos"
      SERVER_PUBLIC: "true"

      TZ: "Europe/Madrid"

      # BepInEx
      BEPINEX: "false"

      # Configuración del mundo
      SERVER_ARGS: >-
        -resetmodifiers
        -modifier combat veryhard
        -modifier deathpenalty hard
        -modifier raids muchless
        -setkey playerevents
        -setkey nomap
        -setkey NoPortals

      # Backups
      BACKUPS: "true"
      BACKUPS_CRON: "0 * * * *"
      BACKUPS_MAX_AGE: "2"

      # Actualizaciones cada hora
      UPDATE_CRON: "0 * * * *"