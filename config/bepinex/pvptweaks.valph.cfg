[General]

## Removes the raid/random-event pin from the minimap.
# Setting type: Boolean
# Default value: true
RemoveRaidPin = false

## Hides your position on the map while sending a chat message.
# Setting type: Boolean
# Default value: true
HideChatPosition = false

## Tracks and logs recent hits taken from other players, used to detect PvP deaths.
# Setting type: Boolean
# Default value: true
TrackPvpHits = false

## Disables the 'bind' terminal command.
# Setting type: Boolean
# Default value: true
DisableBindCommand = false

## Blocks emotes while you're in combat.
# Setting type: Boolean
# Default value: true
BlockEmotesInCombat = false

[Ward]

## Structures inside an enabled player-owned ward take no damage from players.
# Setting type: Boolean
# Default value: true
WardDamageProtection = true

## Players not permitted on a player-owned ward can't modify terrain inside it.
# Setting type: Boolean
# Default value: true
WardTerrainProtection = true

## A new ward can't be placed overlapping an existing ward owned by someone else.
# Setting type: Boolean
# Default value: true
WardOverlapPrevention = true

