# Group names are case-sensitive: bow = all bows, Bow = the basic bow.
# Use the exact group spelling; other entries are literal prefab names.
# Literal prefab matching ignores case. Surrounding spaces are ignored.
# Groups allow/block everyone's matching ground items, not only your throws.
# item_prefab_policy.groups maps custom group names to flat prefab lists.
# Use distinct custom names; exact group matches take priority over prefabs.
# Custom groups cannot contain other groups or redefine built-in names.
#
# Custom group example inside item_prefab_policy (replace groups: {}):
#   groups:
