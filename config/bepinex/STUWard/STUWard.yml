# Server config for account ward limit overrides and item prefab policy.
# Default limits and maximum radii for both ward types are in sighsorry.STUWard.cfg.
#
# item_prefab_policy.blocked_item_prefabs:
#   Cannot be used, equipped, or attacked with inside a foreign enabled ward.
#
# item_prefab_policy.pickup_whitelist:
#   Allowed when Pickup Block Mode = BlockAllExceptWhitelist.
#
# item_prefab_policy.pickup_blacklist:
#   Blocked when Pickup Block Mode = AllowAllExceptBlacklist.
# Both pickup lists accept prefab names and the groups below.
# Built-in pickup groups and subgroups:
#   Melee: sword, axe, club, knife, spear, polearm, fists, shield, pickaxe, tool
#   Ranged: bow, crossbow, arrow, bolt, ammo, bomb
