## Settings file was created by plugin koumodgp v0.9.0
## Plugin GUID: com.modbykou.koumodgp

[Boss]

## Block building certain pieces near a boss altar (OfferingBowl) to stop the campfire/spike-spam-on-spawn cheese. Off by default; pushed to clients.
# Setting type: Boolean
# Default value: false
BlockBuildNearBossAltar = false

## Radius in metres around a boss altar where the blocked pieces cannot be built (bosses can spawn up to ~40m from the altar). Default 20.
# Setting type: Single
# Default value: 20
BossAltarNoBuildRadius = 20

## Comma-separated name fragments; a build piece is blocked near an altar if its prefab name CONTAINS any of these (case-insensitive). Default catches fire builds and spike/stake traps. Leave EMPTY to block ALL building near altars.
# Setting type: String
# Default value: fire,torch,stake,spike,sharp
BossAltarBlockedPieces = fire,torch,stake,spike,sharp

[Character]

## Enforce fresh / server-exclusive characters. When true (DEFAULT), a joining character that has played on ANY world other than this server's is actioned (see Policy.ForeignCharacter). Allowed = a brand-new character, or one that has only ever been on this world. NOTE: Valheim characters are cross-world by design, so this kicks players who use their character elsewhere — set to false to allow imported characters.
# Setting type: Boolean
# Default value: true
ExclusiveCharacter = true

[Combat]

## Prevent attack animation-cancelling (e.g. binding an emote to the attack key to interrupt a swing's recovery and attack faster). When true, clients running koumodgp cannot start an emote during an attack or its short recovery window. Pushed to clients on connect. Enabled by default.
# Setting type: Boolean
# Default value: true
PreventAnimationCancel = true

## Length of the post-swing recovery window (seconds) during which emotes stay blocked — the animation-cancel window. Larger = stricter, but may briefly delay an emote used right after combat. Default 0.75.
# Setting type: Single
# Default value: 0.75
AnimCancelRecoverySeconds = 0.75

[Dungeon]

## Block building inside dungeons except the pieces in DungeonAllowedPieces. Stops the log/pole-stacking escape exploit (build out of the dungeon room, then feather-cape glide to travel fast). Enabled by default; pushed to clients.
# Setting type: Boolean
# Default value: true
RestrictDungeonBuilding = true

## Comma-separated prefab names allowed to be built inside dungeons when the restriction is on. Default 'fire_pit' (the small/normal campfire).
# Setting type: String
# Default value: fire_pit
DungeonAllowedPieces = fire_pit

[General]

## Master switch.
# Setting type: Boolean
# Default value: true
Enabled = true

## Seconds a joining client has to complete the handshake before being kicked. Higher values give slow/heavy-modpack clients time to finish loading (default 90).
# Setting type: Int32
# Default value: 90
HandshakeTimeoutSeconds = 90

## How often clients send a signed heartbeat.
# Setting type: Int32
# Default value: 15
HeartbeatIntervalSeconds = 15

## Consecutive missed heartbeats tolerated before kick (default 6 = ~105s grace, lenient for laggy connections).
# Setting type: Int32
# Default value: 6
MaxMissedHeartbeats = 6

## Admins (adminlist.txt) are fully exempt and silent — never checked or logged.
# Setting type: Boolean
# Default value: true
ExemptAdmins = true

## When true, a client caught actively cheating — an internal OR external cheat: injected assembly, foreign Harmony patch, impossible game state, or a known cheat-program signature — is BANNED (added to bannedlist.txt) instead of only kicked. Compliance-only issues (mod mismatch, missing companion, heartbeat failure) are never auto-banned. Default false = kick only.
# Setting type: Boolean
# Default value: false
AutoBanDetections = false

## Block the 'printseeds' console command on player clients so normal players can't read the world seed. Enabled by default; pushed to clients. (The server console can still use it. Note: a determined mod could read the seed directly — this stops normal players.)
# Setting type: Boolean
# Default value: true
BlockPrintSeed = true

[Logging]

## Discord webhook URL. Empty = disabled. Detection posts are generic ('External violation detected').
# Setting type: String
# Default value: 
DiscordWebhookUrl = 

## Also post server start/stop, config reloads and manual admin actions.
# Setting type: Boolean
# Default value: true
DiscordPostLifecycleEvents = true

[Policy]

## Client never completed the handshake (vanilla or stripped companion).
# Setting type: Action
# Default value: Kick
# Acceptable values: Log, Warn, Flag, Kick, Ban
MissingCompanion = Kick

## Client mod list does not match the allowed list.
# Setting type: Action
# Default value: Kick
# Acceptable values: Log, Warn, Flag, Kick, Ban
ModMismatch = Kick

## An in-memory assembly not owned by any installed mod was found. Advisory only by default (Flag = log to violations.log, no kick): in-memory assemblies have many legitimate causes (embedded mod dependencies, runtime-generated code). Injected tools that actually patch the game are caught by ForeignHarmony instead. Set to Kick to enforce.
# Setting type: Action
# Default value: Flag
# Acceptable values: Log, Warn, Flag, Kick, Ban
InjectedAssembly = Flag

## A Harmony patch from a non-whitelisted owner id was found.
# Setting type: Action
# Default value: Kick
# Acceptable values: Log, Warn, Flag, Kick, Ban
ForeignHarmony = Kick

## A monitored game field held an impossible value (trainer edit).
# Setting type: Action
# Default value: Kick
# Acceptable values: Log, Warn, Flag, Kick, Ban
StateAnomaly = Kick

## A known cheat-program signature (process/window) matched. Kick on its own, even if open for another game.
# Setting type: Action
# Default value: Kick
# Acceptable values: Log, Warn, Flag, Kick, Ban
ProcessMatch = Kick

## Heartbeats stopped, went out of order, or failed their signature.
# Setting type: Action
# Default value: Kick
# Acceptable values: Log, Warn, Flag, Kick, Ban
HeartbeatFail = Kick

## Action when ExclusiveCharacter is on and a character has played outside worlds. Kick by default. Logged to violations.log and the Discord webhook (with the outside world names) regardless of action.
# Setting type: Action
# Default value: Kick
# Acceptable values: Log, Warn, Flag, Kick, Ban
ForeignCharacter = Kick

## A loaded assembly carries the name of an installed mod but is not that mod (e.g. a cheat named 'Jotunn'). No legitimate cause, so Kick by default. Logged + Discord.
# Setting type: Action
# Default value: Kick
# Acceptable values: Log, Warn, Flag, Kick, Ban
ImpostorAssembly = Kick

## A live component comes from an in-memory assembly no installed mod/game/engine accounts for (injected cheat menus). Flag (log + Discord) by default.
# Setting type: Action
# Default value: Flag
# Acceptable values: Log, Warn, Flag, Kick, Ban
OrphanBehaviour = Flag

