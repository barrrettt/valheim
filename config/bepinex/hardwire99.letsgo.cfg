## Settings file was created by plugin LetsGo v1.0.0
## Plugin GUID: hardwire99.letsgo

[Carts]

## Smallest adult tame radius that can hitch a cart. Adult boar is the floor; hens and young never pull.
# Setting type: Single
# Default value: 0.45
MinRadius = 0.45

## Extra meters behind the animal's rear so the vanilla cart is not under a lox, moose, or Asksvin.
# Setting type: Single
# Default value: 1.25
HitchBackPadding = 1.25

## Ignore physics between the cart and the animal pulling it so turns and body clips do not damage the cart.
# Setting type: Boolean
# Default value: true
IgnorePullerCollision = true

## Detach distance is animal radius times this factor.
# Setting type: Single
# Default value: 3.5
DetachDistanceFactor = 3.5

## How far the player can be from the cart while pulling.
# Setting type: Single
# Default value: 2
DetachDistancePlayer = 2

## Joint break force multiplier is max(1, radius * this). Larger adults haul more weight.
# Setting type: Single
# Default value: 2
PullScalePerRadius = 2

[Compatibility]

## If ServersideQoL is loaded, do not also force m_commandable.
# Setting type: Boolean
# Default value: true
SkipCommandableIfServersideQoL = true

## If ServersideQoL is loaded, skip portal-follow (its TeleportFollow already warps distant followers).
# Setting type: Boolean
# Default value: true
SkipRecallIfServersideQoL = true

## If TeleportEverything is loaded, skip our portal-follow to avoid double-teleport.
# Setting type: Boolean
# Default value: true
SkipPortalFollowIfTeleportEverything = true

[Controls]

## Call nearby eligible tames to Follow.
# Setting type: KeyboardShortcut
# Default value: T
PackCallKey = T

[Follow]

## Follow stop distance = max(MediumFollowDistance, radius * this). Larger beasts stay farther back.
# Setting type: Single
# Default value: 3
FollowDistanceFactor = 3

## Minimum follow stop distance for small/medium tames.
# Setting type: Single
# Default value: 3
MediumFollowDistance = 3

[General]

## Master switch. When false, no patches run.
# Setting type: Boolean
# Default value: true
Enabled = true

## Extra BepInEx logs.
# Setting type: Boolean
# Default value: false
DebugLogging = false

## Follow / Stay on tamed creatures, including young.
# Setting type: Boolean
# Default value: true
EnableFollow = true

## Hitch vanilla carts to adult boar-sized or larger tames.
# Setting type: Boolean
# Default value: true
EnableCarts = true

## Hotkey to call nearby tames that are not inside a pen.
# Setting type: Boolean
# Default value: true
EnablePackCall = true

## Following tames travel vanilla portals with you.
# Setting type: Boolean
# Default value: true
EnablePortalFollow = true

## Comma-separated prefab names that never receive orders (for problem AllTameable bosses).
# Setting type: String
# Default value: 
ExcludePrefabs = 

[PackCall]

## How far the pack call reaches.
# Setting type: Single
# Default value: 50
Radius = 50

## Maximum tames one call can take (1-50).
# Setting type: Int32
# Default value: 10
MaxTames = 10

## If true, skip tames enclosed by player-built structures (fences, walls, barns). Stay in the open still answers.
# Setting type: Boolean
# Default value: true
IgnorePenned = true

## How far to look for player-built structures when deciding if a tame is penned.
# Setting type: Single
# Default value: 6
PenCheckDistance = 6

## A tame is penned when this many of 8 directions hit a player-built structure (1-8).
# Setting type: Int32
# Default value: 5
PenHitMin = 5

[Portal]

## Following tames within this radius of the source portal come with you.
# Setting type: Single
# Default value: 12
FollowRadius = 12

