## Settings file was created by plugin ShipConfig v1.4.2
## Plugin GUID: com.ShipConfig

[Display]

## Each player's own. A small panel under the minimap while you are aboard a ship: its speed, its speed multiplier against vanilla, your map exploration radius and, with GrindstoneSkills, your Sailing abilities with their cooldowns (hover a line to read more). Windows such as the inventory draw over it.
# Setting type: Boolean
# Default value: true
Ship Panel = true

[General]

## Server only. When on, every player uses the server's values for this file and cannot override them locally.
# Setting type: Boolean
# Default value: true
Lock Configuration = true

[Multipliers]

## Multiplier on the health of every ship, on top of the per-ship value. 1 is vanilla.
# Setting type: Single
# Default value: 1
Health Multiplier = 2

## Multiplier on the sail force of every ship, on top of the per-ship value. 1 is vanilla.
# Setting type: Single
# Default value: 1
Sail Force Multiplier = 1

## Multiplier on the paddle force of every ship, on top of the per-ship value. 1 is vanilla.
# Setting type: Single
# Default value: 1
Paddle Force Multiplier = 1

## Multiplier on the turning force of every ship, on top of the per-ship value. 1 is vanilla.
# Setting type: Single
# Default value: 1
Turning Multiplier = 1

## Multiplier on the damage taken of every ship, on top of the per-ship value. 1 is vanilla.
# Setting type: Single
# Default value: 1
Damage Taken Multiplier = 1

## Multiplier on the build cost of every ship, on top of the per-ship value. 1 is vanilla.
# Setting type: Single
# Default value: 1
Build Cost Multiplier = 1

[Ship]

## Health of Karve.
# Setting type: Single
# Default value: 500
Karve.Health = 500

## Thrust from the sail. Top speed under sail, scaled by wind and sail size.
# Setting type: Single
# Default value: 0.03
Karve.SailForce = 0.03

## Height above the ship's center of mass, in meters, where the sail's force pushes. Lower makes the ship heel less and capsize less easily at high sail force; negative pushes below the center of mass. 0 removes the heeling from the sail entirely.
# Setting type: Single
# Default value: 1
Karve.SailForceOffset = 1

## Force when paddling forward (slow) and backward.
# Setting type: Single
# Default value: 0.2
Karve.PaddleForce = 0.2

## How fast the rudder swings to full lock while steering.
# Setting type: Single
# Default value: 1
Karve.RudderSpeed = 1

## Turning force while under sail, grows with forward speed.
# Setting type: Single
# Default value: 0.18
Karve.TurnForceSailing = 0.18

## Turning force while paddling.
# Setting type: Single
# Default value: 0.2
Karve.TurnForcePaddling = 0.2

## Forward water drag. Lower is faster and coasts longer; this caps the top speed.
# Setting type: Single
# Default value: 0.001
Karve.ForwardDrag = 0.001

## Sideways water drag. Lower lets the ship slide in a crosswind. Tune with care.
# Setting type: Single
# Default value: 0.15
Karve.SidewaysDrag = 0.15

## Resistance to rolling and pitching. Higher is a steadier deck; too high and the ship stops turning. Tune with care.
# Setting type: Single
# Default value: 0.05
Karve.AngularDamping = 0.05

## Damage the ship takes from slamming into rough seas with players aboard. 0 turns it off.
# Setting type: Single
# Default value: 10
Karve.WaterImpactDamage = 0

## Damage per second while the ship is capsized. 0 turns it off.
# Setting type: Single
# Default value: 20
Karve.UpsideDownDamage = 20

## true: the ship loses health in rain and when its hull is under water, down to half health, like vanilla. false: no weather wear.
# Setting type: Boolean
# Default value: false
Karve.WeatherWear = false

## true: the burning Ashlands ocean damages this ship, like vanilla for every ship except the Drakkar. false: this ship sails the Ashlands ocean unharmed. WARNING: turning this off removes the progression gate that makes the Drakkar necessary, and the Ashlands ocean effects and world key it triggers.
# Setting type: Boolean
# Default value: true
Karve.AshlandsOceanDamage = true

## Multiplier on every hit the ship takes: attacks, collisions, rough seas, capsizing, Ashlands ocean. 1 is vanilla, 0.5 halves it, 0 is the same as Invulnerable.
# Setting type: Single
# Default value: 1
Karve.DamageTaken = 1

## true: the ship takes no damage at all, not from hits, weather or the Ashlands ocean. Ships cannot be dismantled, so an invulnerable ship can only be removed by turning this off.
# Setting type: Boolean
# Default value: false
Karve.Invulnerable = false

## Multiplier on the materials needed to build this ship. 1 is vanilla. Each material is rounded to the nearest whole number and never drops below 1.
# Setting type: Single
# Default value: 1
Karve.BuildCost = 1

