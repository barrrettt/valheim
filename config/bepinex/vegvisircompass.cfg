## Settings file was created by plugin Vegvisir Compass v1.7.1
## Plugin GUID: com.dhobbs.vegvisircompass

[Compass]

## How many times a compass can be used before it is destroyed.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 100
UsesPerCompass = 1

## How far from the Vegvisir it was looted from a compass still works, measured on the X/Z plane so height is ignored. Zero removes the limit. Server-authoritative: the value is baked into each compass when it is granted.
# Setting type: Single
# Default value: 350
# Acceptable value range: From 0 to 100000
RangeMeters = 350

## Seconds the camera takes to pan towards the target, matching the vanilla Vegvisir. Mouse look is held off for the duration of the pan: vanilla applies an eased turn and mouse input to the same field, so without that the pan is cancelled the moment the mouse moves. The lockout is capped at 6 seconds however high this is set, and expires on a deadline so an interrupted pan can never leave you without camera control. Zero turns instantly instead, with no lockout.
# Setting type: Single
# Default value: 3.5
# Acceptable value range: From 0 to 20
LookSmoothing = 3.5

[Debug]

## Log detailed information about looting, RPCs and compass use.
# Setting type: Boolean
# Default value: false
VerboseLogging = false

[Vegvisir]

## Seconds after a Vegvisir is looted before ANY player can loot it again. Enforced by the server. Zero disables the cooldown entirely, and the server then tracks nothing at all.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 86400
LootCooldownSeconds = 0

