[Diagnostics]

## Enables verbose PlayFab Party logging for local diagnostics.
# Setting type: Boolean
# Default value: false
PlayFabVerboseLogging = false

[Server]

## Import a previously played character when no vault copy exists. The first upload is trusted; existing vault copies are never replaced by enrollment. Disable for fresh-character-only servers.
# Setting type: Boolean
# Default value: true
AllowExistingCharacters = false

## Allow one platform account to enroll more than one character name. Server administrators listed in adminlist.txt may always enroll multiple characters; other validation still applies.
# Setting type: Boolean
# Default value: false
AllowMultipleCharacters = false

