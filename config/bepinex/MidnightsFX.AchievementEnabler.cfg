## Settings file was created by plugin AchievementEnabler v0.5.1
## Plugin GUID: MidnightsFX.AchievementEnabler

[Achievements]

## Count progress you made while achievements were switched off. The game records every stat twice:
## once in a raw table that always counts, and once in the table achievements actually read, which
## it skips whenever cheats or mods are detected. Anything done before this mod was installed is
## therefore in the raw table only, and the game never goes back for it - which is why a character
## with hundreds of trees felled can still show no progress towards Lumberjack. This copies the raw
## numbers across when the character loads, taking the higher of the two, so nothing is counted twice.
# Setting type: Boolean
# Default value: true
BackfillAchievementStats = true

## Stop the game lowering your best-ever stats, and put back the ones it already lowered: most days
## survived in a row, highest comfort, highest piece built, and the most of each kind of piece built
## around you. The game checks a new value against your best at the world's current combat difficulty
## only, then writes it over your overall best, so the first days after a change of difficulty can
## write a small number over a large one and relock achievements such as surviving 30 days. With this
## on, a best is only ever raised, your best run of days keeps up with your current one, and bests the
## game already lowered are put back from its per-difficulty records when the character loads.
# Setting type: Boolean
# Default value: true
KeepBestStats = true

## Limit the craft-, eat-, build-, find- and kill-everything achievements to vanilla items, food, build
## pieces, trophies and creatures, leaving out what other mods add. Client-side, and can be changed
## while the game is running. Achievements this lets you unlock stay unlocked if you turn it off again.
# Setting type: Boolean
# Default value: false
VanillaOnlyRequirements = false

[AchievementsPanel]

## Show what the achievements you already know about ask for. Every achievement in the panel that is
## not concealed opens, including the ones the game keeps shut, such as The Homesteader, and its
## details name every requirement with your progress, not only the ones already met. Achievements
## earned by holding others list those others. Secret achievements you have not earned stay
## concealed, and so does any requirement that would give one away, such as the bosses The Viking
## asks for. Turn on ShowSecretAchievements too to see every achievement and every requirement.
## Client side: changes only what your own panel shows, never what counts or unlocks, and takes
## effect the next time the panel is opened.
# Setting type: Boolean
# Default value: false
ShowAllRequirements = false

## Show every achievement in the achievements panel. Secret achievements are listed under their real
## name and description instead of "Concealed" and "Only Odin knows what is hidden here.". With
## ShowAllRequirements on too, every achievement opens and names every requirement. Off by default
## because it spoils them. Client side: changes only what your own panel shows, never what counts or
## unlocks, and takes effect the next time the panel is opened.
# Setting type: Boolean
# Default value: false
ShowSecretAchievements = false

[CheatFlags]

## Clear the cheat flag from a character when it loads. The flag no longer blocks achievements, and
## cheat commands no longer set it, but without this a character flagged before still gets a cheated
## notice in the achievements panel.
# Setting type: Boolean
# Default value: true
ClearCharacterCheatFlag = true

## Never treat a world as cheated. The game counts a world as cheated for good once it has a starting
## key the World Modifiers screen cannot set. That no longer blocks achievements, but without this
## such a world still gets a cheated notice in the achievements panel. The keys are left alone.
# Setting type: Boolean
# Default value: true
IgnoreWorldCheatFlag = true

## Clear the cheated flag from every item as it loads, wherever it loads from: your inventory,
## chests, tombstones and items lying in the world. Since Valheim 1.0.14 a flagged item will not
## stack with a clean one, so a single flagged stack keeps splitting every stack of that item you
## pick up. Clearing it is what puts stacking back. The flag is gone from the save the next time
## the item is written, so this cannot be undone by turning the setting off again.
# Setting type: Boolean
# Default value: true
ClearItemCheatFlagOnLoad = true

[General]

## Master switch, read at startup. Off means nothing is patched and the clearcheateditems command
## is not added.
# Setting type: Boolean
# Default value: true
Enabled = true

## Verbose logging.
# Setting type: Boolean
# Default value: false
EnableDebugMode = false

