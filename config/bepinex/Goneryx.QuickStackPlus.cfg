## Settings file was created by plugin QuickStackPlus v1.2.6
## Plugin GUID: Goneryx.QuickStackPlus

[Diagnostics]

## Log Quick Stack key presses and blocking reasons. Disabled by default. Enable for troubleshooting. No input text is logged.
# Setting type: Boolean
# Default value: false
ShortcutDiagnostics = false

[General]

## Master switch for QuickStackPlus. This setting is controlled by the server. When disabled, all QuickStackPlus features and in-game buttons are disabled for every connected player.
# Setting type: Boolean
# Default value: true
Enabled = true

## The radius in which to search for nearby containers when quick stacking.
# Setting type: Single
# Default value: 25
# Acceptable value range: From 5 to 80
SearchRadius = 25

## Keyboard shortcut used to quick stack nearby containers.
# Setting type: KeyboardShortcut
# Default value: P
QuickStackShortcut = P

## Keyboard shortcut used to sort the player inventory and open container.
# Setting type: KeyboardShortcut
# Default value: O
SortShortcut = O

## Keyboard shortcut used to delete items marked as junk.
# Setting type: KeyboardShortcut
# Default value: Delete
TrashShortcut = Delete

## Optional keyboard shortcut used to sort the currently open container. Leave empty to disable.
# Setting type: KeyboardShortcut
# Default value: None
ContainerSortShortcut = 

[Quick Stack Blacklist]

## Enables the player-local Quick Stack blacklist. When disabled, blacklist markings are hidden and blacklisted stacks are no longer protected from Quick Stack.
# Setting type: Boolean
# Default value: true
EnableBlacklist = true

## Player-controlled shortcut used while clicking an item in your inventory to add or remove that stack from the Quick Stack blacklist. Default: Left Alt + Right Click.
# Setting type: KeyboardShortcut
# Default value: Mouse1 + LeftAlt
BlacklistShortcut = Mouse1 + LeftAlt

[Smart Storage]

## Enables the Smart Storage filter button on opened containers. When enabled, filtered containers are preferred by Quick Stack and can accept selected items even while empty. This setting is local to each player.
# Setting type: Boolean
# Default value: true
EnableStorageFilters = true

## Shows the Smart Storage button next to opened containers. Turning this off only hides the button; existing Smart Storage filters continue to work during Quick Stack. This setting is local to each player.
# Setting type: Boolean
# Default value: true
ShowSmartStorageButton = true

## Optional player-controlled shortcut that toggles ShowSmartStorageButton on or off. Leave empty to disable the shortcut.
# Setting type: KeyboardShortcut
# Default value: None
ToggleSmartStorageButtonShortcut = 

[Sorting]

## Keep blacklisted stacks in their current player inventory slots when sorting. Requires EnableBlacklist. Other items are sorted around these slots. This setting is local to each player.
# Setting type: Boolean
# Default value: false
ExcludeBlacklistedItemsFromSort = false

