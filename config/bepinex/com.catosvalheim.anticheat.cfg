## Settings file was created by plugin CatosAntiCheat v1.0.4
## Plugin GUID: com.catosvalheim.anticheat

[1 - General]

## If false, no checks run and no peers are kicked.
# Setting type: Boolean
# Default value: true
Enabled = true

## Enforce kicks mismatched clients. AuditOnly logs mismatches but allows connections.
# Setting type: String
# Default value: Enforce
# Acceptable values: Enforce, AuditOnly
EnforcementMode = Enforce

## Seconds to wait for a connecting client's mod-list reply before kicking. Vanilla / non-CatosAntiCheat clients will hit this and be kicked.
# Setting type: Single
# Default value: 15
KickTimeoutSeconds = 30

## Number of additional mod-list requests after a timeout. Default 1 gives slow clients one retry.
# Setting type: Int32
# Default value: 1
HandshakeRetries = 1

[2 - Strictness]

## How mod versions are compared. Exact: client must match server exactly. ClientAtLeastServer: client version must be >= server (allows clients to update before the server). Ignore: only mod GUIDs are compared, versions are not.
# Setting type: String
# Default value: ClientAtLeastServer
# Acceptable values: Exact, ClientAtLeastServer, Ignore
VersionPolicy = Exact

## If true, kick clients missing any mod that is installed on the server.
# Setting type: Boolean
# Default value: true
RequireClientHasAllServerMods = true

## Maximum mismatch reasons included in logs, Discord notifications, and player messages.
# Setting type: Int32
# Default value: 6
MaxDisplayedProblems = 6

[3 - Discord]

## Discord webhook URL for kick notifications. Leave empty to disable Discord posting.
# Setting type: String
# Default value: 
WebhookUrl = 

## Post a Discord notification when a peer is kicked for a mod-list mismatch.
# Setting type: Boolean
# Default value: true
PostMismatchKicks = true

## Post a Discord notification when a peer is kicked for not replying in time (usually means they don't have CatosAntiCheat installed).
# Setting type: Boolean
# Default value: true
PostTimeoutKicks = true

## A label for this server, included in every Discord post.
# Setting type: String
# Default value: TEST_SERVER
ServerLabel = TEST_SERVER

[3 - Feedback]

## If true, send a readable rejection reason to the player's in-game chat before disconnecting.
# Setting type: Boolean
# Default value: true
SendKickMessages = true

## Prefix used for player-facing rejection messages.
# Setting type: String
# Default value: CatosAntiCheat
KickMessagePrefix = CatosAntiCheat

## If true, log every client that passes mod validation.
# Setting type: Boolean
# Default value: false
LogAcceptedConnections = true

