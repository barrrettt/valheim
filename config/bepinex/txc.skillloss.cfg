## Settings file was created by plugin TXC Skill Loss v1.2.0
## Plugin GUID: txc.skillloss

[0 - Toggles]

## Where the death loss % comes from. Off = vanilla: the world's Death penalty setting decides (Normal 5%, Hard 7.5%, Easy 2.5%, ...); Category = 'Loss' in each [3 - Categories - ...] section; Skill = 'Loss' in each [4 - Skills - ...] section.
# Setting type: Scope
# Default value: Skill
# Acceptable values: Off, Category, Skill
Loss = Category

## Where the most levels a skill can lose per death comes from ('MaxLevelsLost'). Off = no cap; Category = [3 - Categories - ...] sections; Skill = [4 - Skills - ...] sections.
# Setting type: Scope
# Default value: Off
# Acceptable values: Off, Category, Skill
MaxLevelsLostCap = Off

## Where the catch-up XP values come from ('CatchUpPerLevel', 'CatchUpMax'): extra XP while a skill is below the highest level the character ever had in it. Off = no bonus; Category = [3 - Categories - ...] sections; Skill = [4 - Skills - ...] sections.
# Setting type: Scope
# Default value: Off
# Acceptable values: Off, Category, Skill
CatchUpXp = Off

## Where the XP multiplier comes from ('XpGain'). Off = normal XP; Category = [3 - Categories - ...] sections; Skill = [4 - Skills - ...] sections.
# Setting type: Scope
# Default value: Off
# Acceptable values: Off, Category, Skill
XpGain = Category

## Off = every death loses the same; On = multiply the loss by the [2 - Death Causes] value for how you died.
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
DeathCauses = Off

[1 - General]

## Level = lose % of the skill level and all progress towards the next level (vanilla). TotalXp = lose % of all XP ever earned in the skill; the level and progress bar are recalculated from what's left, so progress is kept. Levels cost more XP the higher they are, so the same % costs fewer levels in TotalXp mode (5% XP is roughly 2% of the level).
# Setting type: LossMode
# Default value: Level
# Acceptable values: Level, TotalXp
LossMode = Level

## true = multiply the configured Loss by the world's 'Death penalty' modifier relative to Normal (Normal x1, Easy x0.5, Hard x1.5, ...); false = the values here are final. Not used when [0 - Toggles] Loss = Off (that already is the world's setting).
# Setting type: Boolean
# Default value: false
ApplyWorldDeathPenalty = false

## true = write details to the BepInEx log: every skill's level before/after each death, XP gained per skill with the multipliers used (summed every 10 s), level-ups, and the stored peak levels on login. For testing; leave false on a live server.
# Setting type: Boolean
# Default value: false
DebugLogging = false

[2 - Death Causes]

## Loss multiplier when the death was: killed by a creature. 1.00 = normal loss, 0.00 = no loss, 0.50 = half, 2.00 = double. Used when DeathCauses = On. Range 0.00-10.00.
# Setting type: Scale
# Default value: 1.00
Enemy = 1.00

## Loss multiplier when the death was: killed by another player's direct hit. 1.00 = normal loss, 0.00 = no loss, 0.50 = half, 2.00 = double. Used when DeathCauses = On. Range 0.00-10.00.
# Setting type: Scale
# Default value: 1.00
PvP = 1.00

## Loss multiplier when the death was: fall damage. 1.00 = normal loss, 0.00 = no loss, 0.50 = half, 2.00 = double. Used when DeathCauses = On. Range 0.00-10.00.
# Setting type: Scale
# Default value: 1.00
Fall = 1.00

## Loss multiplier when the death was: drowning. 1.00 = normal loss, 0.00 = no loss, 0.50 = half, 2.00 = double. Used when DeathCauses = On. Range 0.00-10.00.
# Setting type: Scale
# Default value: 1.00
Drowning = 1.00

## Loss multiplier when the death was: burning, freezing, poison, smoke, water, Ashlands lava/ocean, cinder fire (damage over time counts here even when a creature or player caused it). 1.00 = normal loss, 0.00 = no loss, 0.50 = half, 2.00 = double. Used when DeathCauses = On. Range 0.00-10.00.
# Setting type: Scale
# Default value: 1.00
Environment = 1.00

## Loss multiplier when the death was: trees, carts, boats, collapsing structures, traps/turrets, stalactites, catapults, obliterators, drawbridges, impacts. 1.00 = normal loss, 0.00 = no loss, 0.50 = half, 2.00 = double. Used when DeathCauses = On. Range 0.00-10.00.
# Setting type: Scale
# Default value: 1.00
Accident = 1.00

## Loss multiplier when the death was: self-inflicted, edge of the world, unknown. 1.00 = normal loss, 0.00 = no loss, 0.50 = half, 2.00 = double. Used when DeathCauses = On. Range 0.00-10.00.
# Setting type: Scale
# Default value: 1.00
Other = 1.00

