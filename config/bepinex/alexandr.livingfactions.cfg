## Settings file was created by plugin Living Factions v0.6.5
## Plugin GUID: alexandr.livingfactions

[Dev]

## Enable the developer command file bridge and autostart (for testing the mod).
# Setting type: Boolean
# Default value: false
DevTools = false

[Features]

## Settlements lay footpaths to their buildings (paved in towns) and trails to nearby friendly settlements.
# Setting type: Boolean
# Default value: true
Roads = true

## Villagers walk to work spots, swing tools and haul goods to the storehouse.
# Setting type: Boolean
# Default value: true
VisibleWork = true

## Villagers go indoors at night.
# Setting type: Boolean
# Default value: true
NightSleep = true

## Guards challenge strangers after dark and may attack (see World/NightAttackChance).
# Setting type: Boolean
# Default value: true
NightWatch = true

## Storehouse chests hold part of the settlement's stock as real items; homes hold personal loot.
# Setting type: Boolean
# Default value: true
Chests = true

## Raiders physically arrive when a settlement you are visiting is raided.
# Setting type: Boolean
# Default value: true
StagedRaids = true

## Settlements trade with players.
# Setting type: Boolean
# Default value: true
Trade = true

## A small on-screen chronicle of what the factions are doing.
# Setting type: Boolean
# Default value: true
HudWidget = false

## Factions sell culture-specific relics and unidentified goods.
# Setting type: Boolean
# Default value: true
Relics = true

## Some guards and raiders are archers who keep their distance.
# Setting type: Boolean
# Default value: true
Archers = true

## Traders with an escort leave settlements along their roads and arrive by them while you are near.
# Setting type: Boolean
# Default value: true
Caravans = true

## Friendly settlements hire out two fighters who follow you for a while.
# Setting type: Boolean
# Default value: true
Mercenaries = true

## One guard keeps watch from the deck of the watchtower.
# Setting type: Boolean
# Default value: true
TowerGuards = true

## Between shifts villagers visit other buildings or walk out along the road and back.
# Setting type: Boolean
# Default value: true
Errands = true

## Lamp posts stand along the roads between settlements, one every 30 m.
# Setting type: Boolean
# Default value: true
RoadLamps = true

## Woodcutters fell trees at least 10 m from the buildings and plant a sapling in each stump's place.
# Setting type: Boolean
# Default value: true
TreeFelling = true

[General]

## Mod text language: auto (follow the game when the mod speaks its language, otherwise English) or one of en, ru, pl, de, fr, es, pt.
# Setting type: String
# Default value: auto
Language = auto

## Show notable faction events (wars, new settlements, raids) as on-screen messages.
# Setting type: Boolean
# Default value: true
ShowChronicleMessages = true

[Map]

## The land of each settlement is drawn on the map in its faction's colour, with a legend of the factions on the large map.
# Setting type: Boolean
# Default value: true
FactionZones = true

## Every settlement is on the map from the start, not only those you have found.
# Setting type: Boolean
# Default value: false
ShowAllSettlements = false

[Simulation]

## How fast factions develop. 1 = a camp becomes a village in roughly 15-20 in-game days.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.1 to 10
Pace = 1

## Fulings, Dvergr, Greydwarfs and Draugr also form factions with their own settlements.
# Setting type: Boolean
# Default value: true
RaceFactions = true

## Factions can go to war, raid and capture each other's settlements.
# Setting type: Boolean
# Default value: true
Wars = true

## Upper limit of settlements one faction may hold by expansion.
# Setting type: Int32
# Default value: 6
# Acceptable value range: From 1 to 20
MaxSettlementsPerFaction = 6

## Upper limit of settlements in the whole world.
# Setting type: Int32
# Default value: 40
# Acceptable value range: From 1 to 200
MaxSettlementsTotal = 40

[World]

## How many inhabitants of one settlement are present as actual characters.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 1 to 30
MaxVisibleNpcs = 10

## Building pieces placed per frame while a settlement is brought up to date.
# Setting type: Int32
# Default value: 12
# Acceptable value range: From 1 to 100
PiecesPerFrame = 12

## How many woodcutters may work on the same tree.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 1 to 2
WorkersPerTree = 2

## Chance that the night watch attacks a neutral or wary stranger who ignores its warning and stays close to the settlement after dark. By day it is 0.
# Setting type: Single
# Default value: 0.57
# Acceptable value range: From 0 to 1
NightAttackChance = 0.57

## Settlements closer than this to a neighbour they are not at war with lay a road to it.
# Setting type: Single
# Default value: 1500
# Acceptable value range: From 0 to 5000
RoadReach = 1500

